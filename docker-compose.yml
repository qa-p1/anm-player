services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_ACCESS_TOKEN: ${VITE_API_ACCESS_TOKEN:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_API_ACCESS_TOKEN: ${VITE_API_ACCESS_TOKEN:-}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_ENV: ${API_ENV:-production}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      AURA_DATA_ROOT: ${AURA_DATA_ROOT:-/data}
      AURA_STATE_FILE: ${AURA_STATE_FILE:-/aura-state/storage-state.json}
      DOWNLOAD_OVERWRITE_EXISTING: ${DOWNLOAD_OVERWRITE_EXISTING:-false}
      DOWNLOAD_AUDIO_FORMAT: ${DOWNLOAD_AUDIO_FORMAT:-mp3}
    volumes:
      - aura-data:/data
      - aura-state:/aura-state

volumes:
  aura-data:
  aura-state:
