version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Type definitions follow the oldest supported Node runtime (engines:
      # >=24), so code cannot type-check against APIs Node 24 lacks. Raise
      # this together with "engines" and the Docker/CI Node version.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # typescript-eslint supports TypeScript <6.1; newer releases break
      # linting. Remove once typescript-eslint's peer range allows them.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # A Python minor version (3.14 -> 3.15) is a new language release and
      # Docker tags include release candidates; move between them on purpose,
      # with CI updated to match. Patch releases still arrive automatically.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
