name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: python -m ruff check app tests ../../scripts/start_aura.py ../../scripts/check_critical_coverage.py ../../docker/consolidate-storage.py
      - run: python -W error -m pytest --cov=app --cov-report=term --cov-report=xml --cov-report=json --cov-fail-under=70
      - run: python ../../scripts/check_critical_coverage.py
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            apps/api/coverage.xml
            apps/api/coverage.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run knip
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    env:
      API_ENV: production
      WEB_BIND_HOST: 127.0.0.1
      WEB_PORT: 5173
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral integration token
        run: echo "API_ACCESS_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build clean production images
        run: docker compose build --no-cache
      - name: Start clean stack
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Exercise proxy, SPA, assets, and WebSocket
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/health
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:5173/library/albums | grep -q '<div id="root"></div>'
          asset=$(curl --fail --silent http://127.0.0.1:5173/ | grep -oE '/assets/[^" ]+\.js' | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:5173${asset}" >/dev/null
          if curl --fail --silent --max-time 2 http://127.0.0.1:8000/api/v1/health; then
            echo "Production API port is unexpectedly published" >&2
            exit 1
          fi
          status=$(curl --silent --include --no-buffer --max-time 2 \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            http://127.0.0.1:5173/api/v1/downloads/1/events || true)
          echo "$status" | grep -q '101 Switching Protocols'
      - name: Verify persistence after restart
        run: |
          docker compose restart
          docker compose up --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health
      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-logs
          path: docker-compose.log
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
